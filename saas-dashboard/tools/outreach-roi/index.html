<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Outreach ROI & Pipeline | MarketVibe</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        body { padding: 40px 5%; }
        .tool-container { max-width: 800px; margin: 0 auto; }
        .result-box { margin-top: 2rem; padding: 1.5rem; background: rgba(139, 92, 246, 0.1); border-radius: 12px; display: none; }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="tool-container">
        <a href="/" style="color: var(--accent-primary); text-decoration: none;">← Home</a>
        <h1 style="margin: 1.5rem 0; font-size: 2.5rem;">Outreach ROI Calculator</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Quantify your revenue potential and sales pipeline velocity.</p>
        
        <div class="card">
            <div class="form-group">
                <label class="form-label">Monthly Outreach Volume</label>
                <input type="number" id="vol" class="form-input" placeholder="e.g. 1000">
            </div>
            <div class="form-group">
                <label class="form-label">Expected Reply Rate (%)</label>
                <input type="number" id="reply" class="form-input" placeholder="e.g. 5">
            </div>
            <div class="form-group">
                <label class="form-label">Deal Value ($)</label>
                <input type="number" id="deal" class="form-input" placeholder="e.g. 5000">
            </div>
            <button class="btn btn-hero" onclick="calculate()">Calculate ROI</button>
        </div>

        <div id="result" class="result-box">
            <h3 style="color: var(--accent-secondary);">Pipeline Outlook</h3>
            <p id="res-text"></p>
        </div>
    </div>
    <script>
        function calculate() {
            const v = document.getElementById('vol').value;
            const r = document.getElementById('reply').value;
            const d = document.getElementById('deal').value;
            if (v && r && d) {
                const total = Math.round((v * (r/100) * d)).toLocaleString();
                document.getElementById('res-text').innerText = `Your monthly pipeline potential is $${total}, based on these metrics. MarketVibe high-utility intelligence ensures your business modeling is grounded in real-world outreach dynamics.`;
                document.getElementById('result').style.display = 'block';
            }
        }
    </script>
</body>
</html>
