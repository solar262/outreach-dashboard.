<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact MarketVibe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #03040b; --accent: #8b5cf6; --text: #f8fafc; --muted: #94a3b8; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.6; padding: 80px 5%; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 3rem; font-weight: 900; background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 2rem;}
        p { color: var(--muted); margin-bottom: 1.5rem; }
        .contact-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 2rem; border-radius: 20px; text-align: center; }
        .email { font-size: 1.5rem; color: var(--accent); font-weight: 700; margin: 1rem 0; display: block; text-decoration: none; }
        .back-link { display: inline-block; margin-bottom: 2rem; color: var(--accent); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Home</a>
        <h1>Reach the Hub.</h1>
        <p>Support, strategic inquiries, and partnership requests are handled directly by the engine's founders.</p>
        <div class="contact-box">
            <p>Direct Support Email:</p>
            <a href="mailto:info@marketvibe1.com" class="email">info@marketvibe1.com</a>
        </div>
    </div>
</body>
</html>
